<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#120305">
    <title>Заказ песни</title>
    <!-- фото шапки начинает грузиться сразу, не дожидаясь остального -->
    <link rel="preload" as="image" href="photos/hero.jpg" fetchpriority="high">
    <!-- async: страница не ждёт telegram.org (из России в браузере он бывает медленным).
         Когда скрипт догрузится, вызывается onTelegramReady. -->
    <script src="https://telegram.org/js/telegram-web-app.js" async onload="window.onTelegramReady && window.onTelegramReady()"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* ---------- Палитра: бургунди ---------- */
        :root {
            /* подобрано по бархатному занавесу на фото */
            --bg: #120305;          /* фон страницы — тень занавеса */
            --deep: #2a0509;        /* тёмный бордо карточек */
            --burg: #6e0f19;        /* основной бургунди — складки занавеса */
            --burg-2: #921c28;      /* светлее, блик на бархате */
            --wine: #4a0810;        /* винный, для теней */
            --rose: #d9939b;        /* пыльная роза — акцентный текст */
            --cream: #f3e3d6;       /* кремовый — заголовки */
            --line: rgba(217, 147, 155, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { background: var(--bg); }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 15% 30%, rgba(110, 15, 25, 0.25) 0%, transparent 70%),
                radial-gradient(ellipse 70% 50% at 85% 70%, rgba(74, 8, 16, 0.30) 0%, transparent 70%),
                var(--bg);
            z-index: 0;
            pointer-events: none;
        }

        #app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            position: relative;
            z-index: 2;
            background: linear-gradient(170deg, #150406 0%, #1c0508 50%, #2a0509 100%);
            box-shadow: 0 0 80px rgba(110, 15, 25, 0.25);
        }

        /* ---------- Шапка ---------- */
        .hero { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: var(--deep); }
        .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(18, 3, 5, 0) 35%, rgba(18, 3, 5, 0.55) 70%, rgba(18, 3, 5, 0.95) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 34px;
            gap: 18px;
        }
        .hero-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2em;
            font-weight: 700;
            letter-spacing: 10px;
            color: var(--cream);
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            padding-left: 10px; /* компенсируем letter-spacing справа */
        }

        @keyframes pulse {
            0%   { box-shadow: 0 10px 35px rgba(110, 15, 25, 0.7), 0 0 0 0 rgba(146, 28, 40, 0.6); }
            70%  { box-shadow: 0 10px 35px rgba(110, 15, 25, 0.7), 0 0 0 28px rgba(146, 28, 40, 0); }
            100% { box-shadow: 0 10px 35px rgba(110, 15, 25, 0.7), 0 0 0 0 rgba(146, 28, 40, 0); }
        }

        .btn-main {
            background: linear-gradient(135deg, var(--burg) 0%, var(--burg-2) 100%);
            border: 1px solid rgba(243, 227, 214, 0.25);
            padding: 17px 48px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--cream);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hero .btn-main { animation: pulse 1.8s ease-in-out infinite; }

        /* ---------- Вкладки ---------- */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            gap: 6px;
            padding: 10px 20px;
            background: rgba(18, 3, 5, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .tab {
            flex: 1;
            padding: 10px;
            border-radius: 50px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(243, 227, 214, 0.6);
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .tab.active { background: rgba(110, 15, 25, 0.45); border-color: var(--line); color: var(--cream); }

        .page { display: none; }
        .page.active { display: block; }

        main { padding: 22px 20px; }

        .card {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.45) 0%, rgba(42, 5, 9, 0.65) 100%);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--line);
            margin-bottom: 20px;
            text-align: center;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--cream);
            text-align: center;
            margin: 4px 0 12px;
            font-size: 1.75em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h3 {
            color: var(--rose);
            margin: 18px 0 6px;
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        p { line-height: 1.55; margin: 6px 0; font-size: 0.9em; color: rgba(255, 255, 255, 0.85); font-weight: 300; }
        .accent { color: var(--rose); font-weight: 600; }
        .line { border: none; border-top: 1px solid var(--line); margin: 16px 0; }

        .contact-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            color: var(--cream);
            font-weight: 600;
            font-size: 0.78em;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(110, 15, 25, 0.25);
            border: 1px solid var(--line);
        }
        .contact-item i { font-size: 17px; color: var(--rose); }
        /* нечётное число кнопок: последняя на всю ширину */
        .contact-item:last-child:nth-child(odd) { grid-column: span 2; }

        footer { text-align: center; padding: 10px 20px 30px; color: rgba(243, 227, 214, 0.35); font-size: 0.78em; }

        /* ---------- Фото ---------- */
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 16px 12px 24px; }
        .gallery img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            cursor: zoom-in;
            background: var(--deep);
        }
        .gallery img:nth-child(5n + 1) { grid-column: span 2; aspect-ratio: 4 / 3; }
        .gallery-empty { padding: 60px 30px; text-align: center; color: rgba(243, 227, 214, 0.5); }

        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(10, 2, 3, 0.97);
            align-items: center;
            justify-content: center;
            touch-action: pan-y;
        }
        .viewer.active { display: flex; }
        .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
        .viewer-btn {
            position: absolute;
            background: rgba(110, 15, 25, 0.5);
            border: 1px solid var(--line);
            color: var(--cream);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        .viewer-close { top: 16px; right: 16px; }
        .viewer-prev { left: 12px; top: 50%; transform: translateY(-50%); }
        .viewer-next { right: 12px; top: 50%; transform: translateY(-50%); }
        .viewer-count { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: rgba(243, 227, 214, 0.6); font-size: 0.85em; }

        /* ---------- Окна заказа ---------- */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(10, 2, 3, 0.92);
            animation: fadeIn 0.25s;
            overflow-y: auto;
        }
        .modal.active { display: block; }

        .modal-content {
            background: linear-gradient(170deg, #1a0407 0%, #2a0509 100%);
            margin: 4vh auto;
            padding: 24px 20px;
            border: 1px solid rgba(217, 147, 155, 0.4);
            border-radius: 20px;
            width: 92%;
            max-width: 430px;
            position: relative;
            animation: slideUp 0.25s;
            box-shadow: 0 0 50px rgba(110, 15, 25, 0.5);
        }
        #songModal .modal-content { max-height: 92vh; display: flex; flex-direction: column; }
        #songList { overflow-y: auto; flex: 1; margin: 0 -6px; padding: 0 6px; }

        .close {
            position: absolute;
            right: 14px;
            top: 10px;
            color: var(--rose);
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            background: none;
            border: none;
        }

        .search-box input, .greeting-textarea {
            width: 100%;
            padding: 12px 18px;
            font-size: 16px;
            border: 1px solid rgba(217, 147, 155, 0.45);
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
        }
        .search-box { margin: 6px 0 12px; }
        .search-box input::placeholder, .greeting-textarea::placeholder { color: rgba(255, 255, 255, 0.4); }

        .cat-title {
            position: sticky;
            top: 0;
            background: #210609;
            padding: 8px 4px;
            z-index: 1;
        }
        .song-item {
            padding: 11px 14px;
            margin: 4px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9em;
            border-left: 3px solid transparent;
        }
        .song-item:active, .song-item:hover { background: rgba(110, 15, 25, 0.35); border-left-color: var(--rose); }
        .no-results { padding: 30px 10px; text-align: center; color: rgba(255, 255, 255, 0.5); }

        .selected-song {
            background: rgba(110, 15, 25, 0.35);
            padding: 10px 14px;
            border-radius: 12px;
            margin: 10px 0;
            border-left: 3px solid var(--rose);
            font-weight: 600;
            font-size: 0.9em;
        }
        .greeting-textarea { border-radius: 16px; min-height: 110px; resize: none; }

        .button-group { display: flex; gap: 10px; margin-top: 12px; }
        .btn {
            flex: 1;
            padding: 13px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cream);
        }
        .btn-primary { background: linear-gradient(135deg, var(--burg) 0%, var(--burg-2) 100%); border: 1px solid rgba(243, 227, 214, 0.2); }
        .btn-ghost { background: transparent; border: 1px solid var(--line); color: rgba(243, 227, 214, 0.7); }
        .btn:disabled { opacity: 0.6; cursor: default; }

        .pay-amount {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5em;
            font-weight: 700;
            color: var(--cream);
            line-height: 1;
            margin: 16px 0 6px;
            text-align: center;
        }
        .pay-label { text-align: center; color: var(--rose); letter-spacing: 3px; text-transform: uppercase; font-size: 0.85em; margin-bottom: 26px; }

        .user-badge {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(110, 15, 25, 0.25);
            border: 1px solid var(--line);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.8);
        }
        .user-badge i { color: var(--rose); }

        .success {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(10, 2, 3, 0.97);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            animation: fadeIn 0.3s;
        }
        .success.active { display: flex; }
        .success i { font-size: 54px; color: var(--rose); margin-bottom: 18px; }
    </style>
</head>
<body>

<div id="app">
    <div class="hero">
        <img id="heroImg" src="photos/hero.jpg" alt="" fetchpriority="high">
        <div class="hero-overlay">
            <div class="hero-name" id="heroName"></div>
            <button class="btn-main" id="openOrderBtn">Заказать песню</button>
        </div>
    </div>

    <nav class="tabs">
        <button class="tab active" data-page="home">Заказ</button>
        <button class="tab" data-page="photos">Фото</button>
    </nav>

    <section class="page active" id="page-home">
        <main>
            <div class="card">
                <h2 id="priceTitle"></h2>
                <p>Выбери песню из репертуара и напиши поздравление — мы исполним её вживую.</p>
                <div id="scheduleBlock" style="display:none">
                    <hr class="line">
                    <p class="accent">Порядок исполнения</p>
                    <div id="scheduleList"></div>
                </div>
                <hr class="line">
                <p class="accent">Только песни из репертуара</p>
                <button class="btn btn-ghost" id="openListBtn" style="margin-top:14px;width:100%">Посмотреть репертуар</button>
            </div>

            <div class="card" id="contactsBlock" style="display:none">
                <h2>Контакты</h2>
                <div class="contact-links" id="contactLinks"></div>
            </div>
        </main>
    </section>

    <section class="page" id="page-photos">
        <div class="gallery" id="gallery"></div>
    </section>

    <div id="tgLinkBox" style="display:none;padding:0 20px 18px">
        <a class="contact-item" id="tgLink" target="_blank" rel="noopener"><i class="fab fa-telegram"></i><span>Открыть в Telegram</span></a>
    </div>
    <footer id="footer"></footer>
</div>

<!-- Выбор песни -->
<div class="modal" id="songModal">
    <div class="modal-content">
        <button class="close" data-close="songModal" aria-label="Закрыть">&times;</button>
        <h2>Выберите песню</h2>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Поиск по названию или исполнителю"></div>
        <div id="songList"></div>
    </div>
</div>

<!-- Поздравление -->
<div class="modal" id="greetingModal">
    <div class="modal-content">
        <button class="close" data-close="greetingModal" aria-label="Закрыть">&times;</button>
        <h2>Поздравление</h2>
        <div class="selected-song" id="selectedSong"></div>
        <textarea class="greeting-textarea" id="greetingText" maxlength="1000" placeholder="Кого поздравляем и что сказать (имя, пожелания...)"></textarea>
        <div class="search-box" id="contactBox" style="display:none;margin:10px 0 0">
            <input type="text" id="contactInput" maxlength="100" placeholder="Ваш телефон или ник в Telegram">
        </div>
        <div class="button-group">
            <button class="btn btn-ghost" id="backToList">Назад</button>
            <button class="btn btn-primary" id="toPayment">Далее</button>
        </div>
    </div>
</div>

<!-- Оплата -->
<div class="modal" id="paymentModal">
    <div class="modal-content">
        <div class="user-badge" id="userBadge"><i class="fab fa-telegram"></i><span id="userBadgeText"></span></div>
        <div class="pay-amount" id="payAmount"></div>
        <div class="pay-label">Поздравление</div>
        <button class="btn btn-primary" id="payBtn" style="width:100%;padding:17px;font-size:15px">Оформить заказ</button>
        <button class="btn btn-ghost" id="backToGreeting" style="width:100%;margin-top:10px">Назад</button>
    </div>
</div>

<!-- Готово -->
<div class="success" id="success">
    <i class="fas fa-check-circle"></i>
    <h2>Заказ отправлен</h2>
    <p id="successText"></p>
</div>

<!-- Просмотр фото -->
<div class="viewer" id="viewer">
    <img id="viewerImg" alt="">
    <button class="viewer-btn viewer-close" id="viewerClose" aria-label="Закрыть"><i class="fas fa-xmark"></i></button>
    <button class="viewer-btn viewer-prev" id="viewerPrev" aria-label="Назад"><i class="fas fa-chevron-left"></i></button>
    <button class="viewer-btn viewer-next" id="viewerNext" aria-label="Вперёд"><i class="fas fa-chevron-right"></i></button>
    <div class="viewer-count" id="viewerCount"></div>
</div>

<script src="config.js"></script>
<script>
(() => {
    const $ = id => document.getElementById(id);

    // Открыто ли внутри Telegram — видно по адресу сразу, без скрипта telegram.org:
    // Telegram всегда передаёт данные запуска в #tgWebAppData.
    const launchData = new URLSearchParams(location.hash.slice(1)).get('tgWebAppData') || '';
    const inTelegram = !!launchData || !!window.TelegramWebviewProxy;
    let tg = null;
    let tgUser = null;
    try { tgUser = JSON.parse(new URLSearchParams(launchData).get('user') || 'null'); } catch (e) {}

    // Скрипт Telegram догрузился: разворачиваем окно, красим шапку, берём данные гостя
    window.onTelegramReady = () => {
        tg = window.Telegram?.WebApp || null;
        if (!tg) return;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#120305');
        tg.setBackgroundColor('#120305');
        tgUser = tg.initDataUnsafe?.user || tgUser;
        showUserBadge();
    };

    // ---------- Наполнение из настроек ----------
    document.title = CONFIG.name + ' — заказ песни';
    $('heroName').textContent = CONFIG.name;
    $('heroImg').src = CONFIG.heroPhoto;
    $('heroImg').alt = CONFIG.name;
    $('heroImg').onerror = () => { $('heroImg').style.display = 'none'; };
    $('priceTitle').textContent = 'Заказ песни за ' + CONFIG.price + ' ₽';
    $('payAmount').textContent = CONFIG.price + ' ₽';
    $('footer').textContent = '© ' + new Date().getFullYear() + ' ' + CONFIG.name;
    $('successText').innerHTML = CONFIG.paymentUrl
        ? 'Сейчас откроется страница оплаты.<br><br>После оплаты мы исполним твою песню.'
        : 'Мы получили заказ и скоро исполним твою песню.';

    if (CONFIG.schedule.length) {
        $('scheduleBlock').style.display = 'block';
        CONFIG.schedule.forEach(line => {
            const p = document.createElement('p');
            p.textContent = line;
            $('scheduleList').appendChild(p);
        });
    }

    const ICONS = {
        music: 'fas fa-music', instagram: 'fab fa-instagram', vk: 'fab fa-vk',
        telegram: 'fab fa-telegram', youtube: 'fab fa-youtube', tiktok: 'fab fa-tiktok',
        email: 'fas fa-envelope', link: 'fas fa-link',
    };
    if (CONFIG.contacts.length) {
        $('contactsBlock').style.display = 'block';
        CONFIG.contacts.forEach(c => {
            const a = document.createElement('a');
            a.className = 'contact-item';
            a.href = c.url;
            a.target = '_blank';
            a.rel = 'noopener';
            const i = document.createElement('i');
            i.className = ICONS[c.icon] || ICONS.link;
            const s = document.createElement('span');
            s.textContent = c.title;
            a.append(i, s);
            $('contactLinks').appendChild(a);
        });
    }

    // На обычном сайте (не в Telegram) спрашиваем, как связаться с гостем
    if (!inTelegram) $('contactBox').style.display = 'block';
    if (!inTelegram && CONFIG.botUsername) {
        $('tgLink').href = 'https://t.me/' + CONFIG.botUsername;
        $('tgLinkBox').style.display = 'block';
    }

    function showUserBadge() {
        if (!tgUser) return;
        const name = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
        $('userBadgeText').textContent = name + (tgUser.username ? ' · @' + tgUser.username : '');
        $('userBadge').style.display = 'flex';
    }
    showUserBadge();
    if (window.Telegram?.WebApp) window.onTelegramReady();  // скрипт успел раньше нас

    // ---------- Вкладки ----------
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
            document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + tab.dataset.page));
            const top = document.querySelector('.tabs').offsetTop;
            if (window.scrollY > top) window.scrollTo({ top });
        };
    });

    // ---------- Окна ----------
    const show = id => { document.querySelectorAll('.modal').forEach(m => m.classList.toggle('active', m.id === id)); };
    const hideAll = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = hideAll);
    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) hideAll(); }));

    // ---------- Репертуар ----------
    let selectedSong = null;

    function renderSongs(filter = '') {
        const q = filter.trim().toLowerCase().replace(/ё/g, 'е');
        const list = $('songList');
        list.innerHTML = '';
        let found = 0;
        CONFIG.songs.forEach(cat => {
            const items = cat.items.filter(s => s.toLowerCase().replace(/ё/g, 'е').includes(q));
            if (!items.length) return;
            const h = document.createElement('h3');
            h.className = 'cat-title';
            h.textContent = cat.category;
            list.appendChild(h);
            items.forEach(song => {
                found++;
                const d = document.createElement('div');
                d.className = 'song-item';
                d.textContent = song;
                d.onclick = () => {
                    selectedSong = song;
                    $('selectedSong').textContent = song;
                    $('greetingText').value = '';
                    show('greetingModal');
                };
                list.appendChild(d);
            });
        });
        if (!found) list.innerHTML = '<div class="no-results">Такой песни нет в репертуаре</div>';
    }

    function openSongs() {
        $('searchInput').value = '';
        renderSongs();
        show('songModal');
    }
    $('openOrderBtn').onclick = openSongs;
    $('openListBtn').onclick = openSongs;
    $('searchInput').addEventListener('input', e => renderSongs(e.target.value));

    $('backToList').onclick = () => show('songModal');
    $('toPayment').onclick = () => {
        const need = !$('greetingText').value.trim() ? 'Напишите, пожалуйста, текст поздравления'
            : (!inTelegram && !$('contactInput').value.trim()) ? 'Оставьте телефон или ник в Telegram, чтобы мы могли с вами связаться'
            : '';
        if (need) {
            tg?.showAlert ? tg.showAlert(need) : alert(need);
            return;
        }
        show('paymentModal');
    };
    $('backToGreeting').onclick = () => show('greetingModal');

    $('payBtn').onclick = async function () {
        this.disabled = true;
        this.textContent = 'Отправка...';
        try {
            await fetch('/api/notify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    song: selectedSong,
                    greeting: $('greetingText').value.trim(),
                    contact: $('contactInput').value.trim(),
                    initData: tg?.initData || launchData,
                    user: tgUser,
                }),
            });
        } catch (e) {
            console.error('notify', e);
        }
        hideAll();
        $('success').classList.add('active');
        if (CONFIG.paymentUrl) {
            setTimeout(() => {
                if (tg?.openLink) tg.openLink(CONFIG.paymentUrl);
                else window.location.href = CONFIG.paymentUrl;
            }, 2000);
        }
    };

    // ---------- Фото ----------
    const photos = CONFIG.photos;
    let current = 0;

    if (!photos.length) {
        $('gallery').outerHTML = '<div class="gallery-empty">Фото скоро появятся</div>';
    } else {
        photos.forEach((src, i) => {
            const img = document.createElement('img');
            img.src = src;
            img.loading = 'lazy';
            img.alt = CONFIG.name;
            img.onclick = () => openViewer(i);
            $('gallery').appendChild(img);
        });
    }

    function openViewer(i) {
        current = (i + photos.length) % photos.length;
        $('viewerImg').src = photos[current];
        $('viewerCount').textContent = (current + 1) + ' / ' + photos.length;
        $('viewer').classList.add('active');
    }
    $('viewerClose').onclick = () => $('viewer').classList.remove('active');
    $('viewerPrev').onclick = () => openViewer(current - 1);
    $('viewerNext').onclick = () => openViewer(current + 1);

    let touchX = null;
    $('viewer').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    $('viewer').addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 50) openViewer(current + (dx < 0 ? 1 : -1));
        touchX = null;
    });
    document.addEventListener('keydown', e => {
        if (!$('viewer').classList.contains('active')) return;
        if (e.key === 'Escape') $('viewer').classList.remove('active');
        if (e.key === 'ArrowLeft') openViewer(current - 1);
        if (e.key === 'ArrowRight') openViewer(current + 1);
    });
})();
</script>
</body>
</html>
